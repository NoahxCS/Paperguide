<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Paperguide &mdash; KTU exam paper quality checker</title>
    <meta
      name="description"
      content="Upload a KTU question paper, confirm the 2024-scheme syllabus and scope, and review its quality or predict how weak, average and strong students would experience it."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M9 8h10a4 4 0 0 1 4 4v12H13a4 4 0 0 1-4-4V8z' fill='white' opacity='.92'/%3E%3Cpath d='M12 12h7M12 16h7M12 20h4' stroke='%234f46e5' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="appbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="7" fill="currentColor" />
            <path d="M9 8h10a4 4 0 0 1 4 4v12H13a4 4 0 0 1-4-4V8z" fill="#fff" opacity=".92" />
            <path d="M12 12h7M12 16h7M12 20h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span class="brand-name">Paperguide</span>
          <span class="badge badge-scheme" title="Targeting the KTU 2024 scheme">KTU 2024</span>
        </div>
        <div class="appbar-actions">
          <span id="stat-pill" class="stat-pill" hidden></span>
          <button id="btn-theme" class="btn btn-ghost" type="button" title="Toggle light and dark">
            <span class="theme-icon" aria-hidden="true"></span><span class="sr-only">Toggle theme</span>
          </button>
          <button id="btn-demo" class="btn btn-secondary" type="button" title="Replay a cached run on a real sample paper">
            Demo mode
          </button>
          <button id="btn-settings" class="btn btn-secondary" type="button" aria-haspopup="dialog">
            Settings
          </button>
          <button id="btn-new" class="btn btn-primary" type="button" title="Start a fresh session (nothing is stored)">
            New session
          </button>
        </div>
      </header>

      <main id="chat" class="chat" aria-live="polite" aria-label="Conversation"></main>

      <footer class="composer-wrap">
        <div class="composer" id="composer">
          <div id="attachments" class="attachments" hidden></div>
          <textarea
            id="input"
            class="composer-input"
            rows="1"
            placeholder="Paste the question paper, or describe the exam…"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <button id="btn-attach" class="btn btn-icon" type="button" title="Attach an image or PDF of the paper">
                <svg viewBox="0 0 20 20" aria-hidden="true" width="18" height="18">
                  <path
                    d="M10 4v12M4 10h12"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    fill="none"
                  />
                </svg>
                <span class="sr-only">Attach a file</span>
              </button>
              <input
                id="file-input"
                type="file"
                class="sr-only"
                multiple
                accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/tiff,application/pdf,text/plain,text/markdown"
              />
              <span id="composer-hint" class="composer-hint">Images are compressed to fit OCR.space's 1 MB free limit.</span>
            </div>
            <div class="composer-right">
              <button id="btn-stop" class="btn btn-secondary" type="button" hidden>Stop</button>
              <button id="btn-send" class="btn btn-primary btn-send" type="button" disabled>
                Send
                <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
                  <path d="M3 10h11M10 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <p class="footnote">
          Sessions live in this browser tab only &mdash; refreshing clears the paper, the syllabus and your API keys.
        </p>
      </footer>
    </div>

    <div id="drawer-scrim" class="scrim" hidden></div>
    <aside id="settings-drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Settings" hidden></aside>
    <div id="toasts" class="toasts" aria-live="assertive"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
